name: Verify NOVA Dimension macOS

on:
  push:
    branches:
      - feature/morph-dimension-1.4
    paths:
      - "Sources/**"
      - "Tests/**"
      - "Package.swift"
      - "Info.plist"
      - "build.sh"
      - ".github/workflows/verify-macos.yml"
  pull_request:
    paths:
      - "Sources/**"
      - "Tests/**"
      - "Package.swift"
      - "Info.plist"
      - "build.sh"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Run Swift navigation tests
        run: swift test --disable-sandbox
      - name: Build universal macOS installer
        run: NOVA_INSTALLER_ONLY=1 ./build.sh
      - name: Verify signed bundle and version
        shell: bash
        run: |
          set -euo pipefail
          test -f "dist/Nova-OS-Installer.pkg"
          test -d "dist/Nova OS.app"
          /usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "dist/Nova OS.app/Contents/Info.plist" | grep -x '1.4.0'
          codesign --verify --deep --strict "dist/Nova OS.app"
      - name: Save beta installer for manual QA
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-OS-Dimension-1.4.0-macOS-Beta
          path: dist/Nova-OS-Installer.pkg
          if-no-files-found: error
          retention-days: 7

