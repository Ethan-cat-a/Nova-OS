name: Publish NOVA OS for macOS

on:
  push:
    branches: [main]
    paths:
      - Info.plist
      - build.sh
      - .github/workflows/publish-macos.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nova-os-macos-release
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish the macOS installer
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Restore existing Sparkle signing key (if configured)
        shell: bash
        env:
          SPARKLE_KEY: ${{ secrets.NOVA_SPARKLE_ED25519_PRIVATE }}
        run: |
          if [[ -n "$SPARKLE_KEY" ]]; then
            mkdir -p .secrets
            printf '%s' "$SPARKLE_KEY" > .secrets/sparkle-ed25519.private
            chmod 600 .secrets/sparkle-ed25519.private
            echo "Existing Sparkle signing key available."
          else
            echo "::warning::No NOVA_SPARKLE_ED25519_PRIVATE secret: standalone installer only. This release will not be available through Sparkle automatic updates."
          fi

      - name: Verify AI Overview removal
        shell: bash
        run: |
          set -euo pipefail
          if grep -inE 'novaResearch|nova-v8\.vercel\.app|requestOverview|AIOverviewsEnabled|novaRenderOverview' Sources/*.swift; then
            echo "::error::AI Overview code must not be shipped in 1.4.1"
            exit 1
          fi
          grep -q '/api/search?q=' Sources/NovaOSApp.swift
          grep -q "novaCache" Sources/NovaOSApp.swift
          grep -q "showMorph" Sources/NovaOSApp.swift
          grep -q "showDimension" Sources/NovaOSApp.swift
      - name: Run navigation unit tests
        run: swift test --disable-sandbox

      - name: Build universal app and verify signature
        shell: bash
        run: NOVA_INSTALLER_ONLY=1 ./build.sh

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' Info.plist)"
          BUILD_NUMBER="$(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' Info.plist)"
          TAG="v$VERSION"
          PKG="dist/Nova-OS-Installer.pkg"
          ZIP="updates/Nova-OS-$VERSION-build$BUILD_NUMBER.zip"
          test -f "$PKG"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists."
            exit 1
          fi
          {
            echo "NOVA OS 1.4.1 temporarily removes AI Overview to reduce load on NOVA Intelligence servers."
            echo ""
            echo "- Removes AI Overview cards, automatic AI requests, the preference toggle, and the native AI bridge."
            echo "- Regular web, image, video and news search remain available."
            echo "- NOVA Morph (Command-Shift-M): five local styles, supported natural-language instructions, reset, and optional site-specific preferences."
            echo "- NOVA Dimension (Command-Shift-D): persistent zoomable workspace canvas with movable website and note cards."
            echo "- Import tabs or add website URLs; activate up to four live isolated web previews."
            echo "- Each Space has its own saved canvas; notes and positions stay on the Mac."
            echo "- Retains Flow features: OmniSearch, Spaces, gallery, pinned tabs, and Focus Reader."
            echo "- Workspace backup, migration, and resilient NOVA Search endpoints."
            echo ""
            echo "**Note:** This build is ad-hoc signed rather than Apple Developer ID notarized."
          } > release-notes.md
          ASSETS=("$PKG")
          if [[ -f "$ZIP" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add updates
            if ! git diff --cached --quiet; then
              git commit -m "Publish Sparkle feed for Nova OS $VERSION"
              git push origin HEAD:main
            fi
            ASSETS+=("$ZIP")
            {
              echo ""
              echo "This release includes a signed Sparkle update archive for existing installations."
            } >> release-notes.md
          else
            {
              echo ""
              echo "**Manual install required:** The previous Sparkle signing key was not available in CI, so this release does not change the automatic-update feed."
            } >> release-notes.md
          fi
          gh release create "$TAG" "${ASSETS[@]}" --target "$(git rev-parse HEAD)" --title "Nova OS $VERSION — Dimension" --notes-file release-notes.md
